name: local-runnable-ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run demo
        run: make run-demo
      - name: Run tests
        run: make test
      - name: Generate reports
        run: make reports
      - name: Audit local/GitHub runnable state
        run: make audit
